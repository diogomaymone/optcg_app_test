    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #05070D;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* no copy/lookup popup on long presses, swipes and drags; typing fields stay selectable */
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea,
      [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* no square browser focus ring on the search field and inputs (their rounded box shows focus) */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* buttons and tiles (Pressable = div with tabindex) ease into and out of their pressed look */
      [tabindex] {
        transition: transform 0.12s ease-out, opacity 0.12s ease-out, background-color 0.12s ease-out;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
